<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Rastreamento | Nauj Doceria</title>
  <link rel="icon" href="favicon.ico">
  <!-- Endereco proprio para a central. Ela mora dentro do painel, porque le os
       mesmos pedidos e precisa do mesmo login: o quadro mostra faturamento por
       campanha, e isso nao pode ficar aberto na internet.

       Este arquivo existe em vez de um rewrite no vercel.json porque o
       cleanUrls resolve o caminho pelo sistema de arquivos antes de aplicar
       rewrite: sem um central.html de verdade, /central devolvia 404. -->
  <meta http-equiv="refresh" content="0; url=/admin?aba=rastreamento">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFF8F1;
      color: #7A6560;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.9rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1B1310; color: #B5A6A0; }
    }
  </style>
</head>
<body>
  <p>Abrindo a central de rastreamento…</p>
  <script>
    // O meta refresh acima ja resolve; isto so torna a troca imediata para
    // quem tem JavaScript, sem deixar esta pagina no historico do navegador.
    location.replace('/admin?aba=rastreamento');
  </script>
</body>
</html>
